<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
        <h2 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" class="w-full border border-gray-300 p-2 rounded focus:ring focus:ring-blue-300" required>  
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" class="w-full border border-gray-300 p-2 rounded focus:ring focus:ring-blue-300" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Entrar</button>
            <a href="{% url 'registro_usuario' %}" class="text-sm text-blue-600 hover:underline">¿No tienes una cuenta? Regístrate</a>
        </form>
    </div>
</body>
</html>
